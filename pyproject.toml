[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "discern"
version = "0.1.0"
description = "Computer vision that turns paper records into structured, searchable data."
authors = []
packages = [{include = "discern", from = "src"}]

# ---------------------------------------------------------------------------
# Package sources
# ---------------------------------------------------------------------------

[[tool.poetry.source]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------

[tool.poetry.dependencies]
python             = ">=3.11,<4.0"
pydantic           = ">=2.7"
pydantic-settings  = ">=2.3"
pyyaml             = ">=6.0"
structlog          = ">=24.1"
fastapi            = ">=0.111"
python-multipart   = ">=0.0.9"
uvicorn            = {version = ">=0.30", extras = ["standard"]}
sqlalchemy         = ">=2.0"
alembic            = ">=1.13"
psycopg2-binary    = ">=2.9"
torch              = {version = "2.10.0", source = "pytorch-cpu"}
torchvision        = {version = "0.25.0", source = "pytorch-cpu"}
pillow             = ">=10.3"
anthropic          = ">=0.40"
numpy              = ">=1.26"
opencv-python-headless = ">=4.9"
faker              = ">=25.0"
pymupdf            = ">=1.24"
pytesseract        = ">=0.3"
python-jose        = {version = ">=3.3", extras = ["cryptography"]}
passlib            = {version = ">=1.7", extras = ["bcrypt"]}
bcrypt             = ">=4.0,<5.0"
cryptography       = ">=42.0"
email-validator    = ">=2.1"

# ---------------------------------------------------------------------------
# Dev / test dependencies
# ---------------------------------------------------------------------------

[tool.poetry.group.dev.dependencies]
ruff         = ">=0.4"
mypy         = ">=1.10"
pytest       = ">=8.2"
pytest-cov   = ">=5.0"
types-PyYAML = ">=6.0"
types-Pillow = ">=10.2"
pre-commit   = ">=3.7"
httpx        = ">=0.27"
pytest-mock  = ">=3.14"

# ---------------------------------------------------------------------------
# Tool config (unchanged)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version       = "3.13"
strict               = false
ignore_missing_imports = true
packages             = ["discern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["src/discern"]
