services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: discern
      POSTGRES_PASSWORD: discern
      POSTGRES_DB: discern
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discern"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DISCERN_DATABASE_URL: postgresql://discern:discern@db:5432/discern
      DISCERN_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads
      - checkpoints:/app/checkpoints

volumes:
  pg_data:
  uploads:
  checkpoints:
